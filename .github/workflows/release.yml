name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifacts: 'dist/*.exe'
          - os: ubuntu-latest
            artifacts: 'dist/*.AppImage,dist/*.deb'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run test suite
        run: |
          node bin/check-syntax.mjs
          node test/smoke.mjs
          node test/station-sync.mjs
          node test/dashboard.mjs
          node test/pricebook.mjs
          node test/sub2api-render.mjs
          node test/ui-check.mjs

      - name: Build distributables
        run: pnpm dist
        env:
          # 签名凭据由仓库 Secrets 提供（无签名也能出包，只是未签名）
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: release-assets/*

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RelayHub ${{ github.ref_name }}
          body: |
            安装包下载见下方 Assets。

            **Windows**：`RelayHub Setup <版本>.exe`（NSIS，可选安装目录）
            **Linux**：`AppImage`（直接运行）/ `deb`

            > macOS 包需要签名/公证（未配置证书时构建会跳过）。
            完整变更见 [CHANGELOG](CHANGELOG.md)。
          files: |
            artifacts/dist-windows-latest/*
            artifacts/dist-ubuntu-latest/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
