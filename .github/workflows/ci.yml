name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          # 跳过 Electron 二进制下载：CI 只跑单元/拟真测试，不需要 GUI
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Syntax guards (22 modules + 11 UI/feature guards)
        run: node bin/check-syntax.mjs

      - name: Smoke tests
        run: node test/smoke.mjs

      - name: Mock-station tests (22 scenarios)
        run: node test/station-sync.mjs

      - name: Dashboard aggregation
        run: node test/dashboard.mjs

      - name: Price book
        run: node test/pricebook.mjs

      - name: Sub2API render semantics
        run: node test/sub2api-render.mjs

      - name: Process probe
        run: node test/procs-probe.mjs

      - name: UI tokens / contrast / a11y
        run: node test/ui-check.mjs
