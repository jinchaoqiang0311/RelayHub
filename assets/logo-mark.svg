<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RelayHub">
  <title>RelayHub</title>
  <!-- 品牌规范：纯色，无渐变/无阴影/无描边特效（brand/references/logo-usage-rules.md） -->
  <!-- 概念：中心枢纽（hub）+ 三向中继臂（relay），指向多站点 / 多 Agent 分发 -->
